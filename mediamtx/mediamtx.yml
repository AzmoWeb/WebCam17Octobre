# Configuration MediaMTX pour CamManif.
# Ne contient que les réglages modifiés ; le reste garde les valeurs par défaut.
#
# Fonctionnement :
#  - les caméras / OBS publient en RTMP (ou RTSP) sur live/<CLE_SECRETE> ;
#  - MediaMTX demande au site (authHTTPAddress) si la clé est valide ;
#  - le HLS, l'API et la lecture des enregistrements n'écoutent que sur 127.0.0.1 :
#    les spectateurs passent par le site, qui ne révèle jamais la clé ;
#  - chaque direct est enregistré (replays + clips) et signalé au site (hooks).
#
# ⚠ Remplace "change-me-hook-secret" (2 fois plus bas) par la même valeur que
#   MEDIAMTX_HOOK_SECRET dans .env.local.

logLevel: info

# --- Authentification déléguée au site Next.js ---
authMethod: http
authHTTPAddress: http://127.0.0.1:3000/api/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# --- API (statut "en direct"), accessible uniquement en local ---
api: yes
apiAddress: 127.0.0.1:9997

# --- Ingestion ---
rtmp: yes
rtmpAddress: :1935
rtsp: yes
rtspAddress: :8554

# --- Lecture HLS, uniquement en local (proxy Next.js) ---
hls: yes
hlsAddress: 127.0.0.1:8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# --- Lecture des enregistrements (replays / clips), uniquement en local ---
playback: yes
playbackAddress: 127.0.0.1:9996

# --- Désactivés (non utilisés) ---
webrtc: no
srt: no

pathDefaults:
  # Enregistrement de chaque direct, supprimé automatiquement après 7 jours.
  record: yes
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10m
  recordDeleteAfter: 7d

paths:
  # Qualités réduites, générées à la demande par ffmpeg (seulement si un
  # spectateur les choisit). Nécessite ffmpeg dans le PATH.
  "~^live/([A-Za-z0-9]+)_(720|480)$":
    record: no
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -rtsp_transport tcp
      -i rtsp://127.0.0.1:8554/live/$G1
      -vf scale=-2:$G2 -c:v libx264 -preset veryfast -tune zerolatency -g 30
      -b:v 2500k -maxrate 2500k -bufsize 5000k
      -c:a aac -b:a 96k
      -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 15s

  # Toutes les caméras : prévenir le site au début et à la fin du direct.
  all_others:
    runOnReady: curl -s -X POST "http://127.0.0.1:3000/api/mediamtx/hook?event=ready&path=$MTX_PATH&secret=change-me-hook-secret"
    runOnNotReady: curl -s -X POST "http://127.0.0.1:3000/api/mediamtx/hook?event=notready&path=$MTX_PATH&secret=change-me-hook-secret"
